# База для разработки: docker compose up -d (из папки server)
services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ironrise
      POSTGRES_PASSWORD: ironrise
      POSTGRES_DB: ironrise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
