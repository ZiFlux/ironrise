<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="Times New Roman, serif" font-size="18" fill="none" stroke="#000" stroke-width="2">
  <!-- Носимое устройство -->
  <rect x="40" y="60" width="200" height="150"/>
  <text x="140" y="95" text-anchor="middle" fill="#000" stroke="none">Носимое</text>
  <text x="140" y="118" text-anchor="middle" fill="#000" stroke="none">устройство</text>
  <rect x="80" y="140" width="120" height="50"/>
  <text x="140" y="170" text-anchor="middle" fill="#000" stroke="none">Датчик ЧСС</text>
  <text x="30" y="52" fill="#000" stroke="none">1</text>
  <text x="212" y="135" fill="#000" stroke="none">2</text>

  <!-- Мобильное устройство -->
  <rect x="300" y="40" width="200" height="230"/>
  <text x="400" y="75" text-anchor="middle" fill="#000" stroke="none">Мобильное</text>
  <text x="400" y="98" text-anchor="middle" fill="#000" stroke="none">устройство</text>
  <rect x="320" y="115" width="160" height="40"/>
  <text x="400" y="141" text-anchor="middle" fill="#000" stroke="none">Ввод тренировки</text>
  <rect x="320" y="165" width="160" height="40"/>
  <text x="400" y="191" text-anchor="middle" fill="#000" stroke="none">Справочник</text>
  <rect x="320" y="215" width="160" height="40"/>
