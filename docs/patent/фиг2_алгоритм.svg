  <g fill="#000" stroke="none" text-anchor="middle">
    <text x="380" y="40">Начало тренировки, приём отсчётов ЧСС</text>
    <text x="380" y="120">Записи о подходах, идентификатор тренировки</text>
    <text x="380" y="200">Передача на сервер: время, подходы, отсчёты ЧСС</text>
    <text x="380" y="272">Проверка времени; тренировка уже принята?</text>
    <text x="380" y="372">Покрытие отсчётами ≥ 0,6 длительности?</text>
    <text x="160" y="470">V = 0,5</text>
    <text x="516" y="458">V = 1; ×0,3 если среднее ЧСС &lt; покой + 15;</text>
    <text x="516" y="480">×0,6 если отклонение ЧСС &lt; 5</text>
    <text x="380" y="572">×0,3 если длительность &lt; 45 с × число подходов</text>
    <text x="380" y="652">Отстающие части тела: уровень &lt; средний − 1,5</text>
    <text x="380" y="732">За подход: XP = 18 · d · B · V (не более 8 подходов)</text>
    <text x="380" y="812">Суточное ограничение: сумма за сутки ≤ 600</text>
    <text x="380" y="892">Сохранение приращений, очков мышц и журнала</text>
    <text x="380" y="972">Перерисовка модели тела на мобильном устройстве</text>
    <text x="690" y="262">Да: прежний</text>
    <text x="690" y="284">результат</text>
    <text x="60" y="420">Нет</text>
    <text x="664" y="420">Да</text>
    <text x="380" y="1060">Фиг. 2</text>
  </g>
