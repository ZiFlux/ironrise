<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 0 800 660" font-family="Times New Roman, serif" font-size="16" fill="none" stroke="#000" stroke-width="2">
  <!-- а) силовая тренировка: подъём на подходе, спад на отдыхе -->
